# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm install
      - name: Verify Payload import maps are up to date
        run: |
          set -euo pipefail
          import_map_error='Payload import maps are stale. Run '\''npm run generate:importmaps'\'' and commit the updated files.'
          import_map_paths=(
            "dev/src/app/(payload)/admin/importMap.js"
            "dev-alternative-config/src/app/(payload)/admin/importMap.js"
          )
          for path in "${import_map_paths[@]}"; do
            if [ ! -f "$path" ]; then
              echo "::error::$import_map_error (missing: $path)"
              exit 1
            fi
            if ! git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "::error::$import_map_error (untracked: $path)"
              exit 1
            fi
          done
          npm run generate:importmaps
          git diff --exit-code "${import_map_paths[@]}" || (
            echo "::error::$import_map_error"
            exit 1
          )
      - name: Typecheck (plugin build)
        run: npx nx run plugin:build
      - name: Typecheck (plugin unit tests)
        run: npx tsc -p plugin/tsconfig.spec.json --noEmit
      - name: Test with coverage
        run: npm run test:coverage
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/**
          if-no-files-found: warn
          retention-days: 14
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage
          flags: unittests
          name: payload-crowdin-sync
          fail_ci_if_error: false
          verbose: true
