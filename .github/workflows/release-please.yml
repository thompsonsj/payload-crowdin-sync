on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_missing:
        description: Publish public packages whose current package.json version is not on npm
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      plugin_release_created: ${{ steps.release.outputs['plugin--release_created'] }}
      plugin_version: ${{ steps.release.outputs['plugin--version'] }}
      document_release_created: ${{ steps.release.outputs['document--release_created'] }}
      document_version: ${{ steps.release.outputs['document--version'] }}
      adapters_release_created: ${{ steps.release.outputs['adapters--release_created'] }}
      adapters_version: ${{ steps.release.outputs['adapters--version'] }}
    steps:
      - uses: google-github-actions/release-please-action@e4dc86ba9405554aeba3c6bb2d169500e7d3b4ee # v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          include-component-in-tag: true

  publish:
    needs: release-please
    if: ${{ github.ref == 'refs/heads/main' && (needs.release-please.outputs.plugin_release_created == 'true' || needs.release-please.outputs.document_release_created == 'true' || needs.release-please.outputs.adapters_release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_missing)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PUBLISH_MISSING: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_missing && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Require payload-localization-adapters on npm
        if: ${{ needs.release-please.outputs.plugin_release_created == 'true' || env.PUBLISH_MISSING == 'true' }}
        env:
          ADAPTERS_RELEASE_CREATED: ${{ needs.release-please.outputs.adapters_release_created }}
          ADAPTERS_VERSION: ${{ needs.release-please.outputs.adapters_version }}
        run: |
          set -euo pipefail
          required=$(node -p "require('./plugin/package.json').dependencies['payload-localization-adapters']")
          echo "Plugin requires payload-localization-adapters@${required}"
          if [ "$required" = "0.0.0" ] || [[ "$required" == file:* ]]; then
            echo "::error::payload-crowdin-sync still depends on unpublished payload-localization-adapters (${required}). Publish adapters first, then let release-please bump this dependency."
            exit 1
          fi
          if [ "$ADAPTERS_RELEASE_CREATED" = "true" ]; then
            normalized=${required#^}
            normalized=${normalized#~}
            if [ "$normalized" != "$ADAPTERS_VERSION" ]; then
              echo "::error::plugin requires payload-localization-adapters@${required} but this job publishes ${ADAPTERS_VERSION}."
              exit 1
            fi
            echo "This job will publish payload-localization-adapters@${ADAPTERS_VERSION} before the plugin."
            exit 0
          fi
          if [ "$PUBLISH_MISSING" = "true" ]; then
            echo "This job will publish payload-localization-adapters@${required} before the plugin if it is not already on npm."
            exit 0
          fi
          npm view "payload-localization-adapters@${required}" version
      - name: Build payload-localized-fields
        if: ${{ needs.release-please.outputs.document_release_created == 'true' || env.PUBLISH_MISSING == 'true' }}
        run: |
          npx nx run document:build
          node tools/scripts/rewrite-dist-entrypoints.mjs dist/document
      - name: Publish payload-localized-fields
        if: ${{ needs.release-please.outputs.document_release_created == 'true' || env.PUBLISH_MISSING == 'true' }}
        working-directory: dist/document
        run: node ../../tools/scripts/npm-publish-if-missing.mjs
      - name: Build payload-localization-adapters
        if: ${{ needs.release-please.outputs.adapters_release_created == 'true' || env.PUBLISH_MISSING == 'true' }}
        run: |
          npx nx run adapters:build
          node tools/scripts/rewrite-dist-entrypoints.mjs dist/adapters
      - name: Publish payload-localization-adapters
        if: ${{ needs.release-please.outputs.adapters_release_created == 'true' || env.PUBLISH_MISSING == 'true' }}
        working-directory: dist/adapters
        run: node ../../tools/scripts/npm-publish-if-missing.mjs
      - name: Build payload-crowdin-sync
        if: ${{ needs.release-please.outputs.plugin_release_created == 'true' || env.PUBLISH_MISSING == 'true' }}
        run: |
          npx nx run plugin:build
          node tools/scripts/rewrite-dist-entrypoints.mjs dist/plugin
      - name: Publish payload-crowdin-sync
        if: ${{ needs.release-please.outputs.plugin_release_created == 'true' || env.PUBLISH_MISSING == 'true' }}
        working-directory: dist/plugin
        run: node ../../tools/scripts/npm-publish-if-missing.mjs
